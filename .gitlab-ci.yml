.common-rules:
  - &rule-is-mr
    if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - &rule-is-releasable
    if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

include:
  - local: templates/mr.yml
    rules:
      - *rule-is-mr
  - local: templates/release.yml
    rules:
      - *rule-is-releasable
